---
# ---------------------------------------------------------------------------
# MSSQL envanter bağlantısı
# Şifre AAP Survey'deki 'password' tipli alandan gelir (mssql_password).
# Repoda secret tutulmaz.
# ---------------------------------------------------------------------------
mssql_host: "PGARSQLTEM01"
mssql_port: 1453
mssql_user: "Sql_inventory_user"
mssql_password: ""             # Survey (password tipi, $encrypted$)
mssql_db: "MysqlInventory"

# Sadece okuma. Temporal tablo: FOR SYSTEM_TIME yok -> güncel satırlar gelir.
# isActive filtresi SQL'de DEĞİL Ansible'da yapılır; böylece pasif sunucular
# raporda "isActive=0" olarak görünür (sessizce kaybolmaz).
mysqlinv_query: >-
  SELECT id, ServerName, ListeningIP, ListeningPort, Fqdn, [Type], isActive
  FROM dbo.My_ServerInventory
  WHERE DeleteDate IS NULL
  ORDER BY ServerName

# ---------------------------------------------------------------------------
# Type kolonu -> Survey ortamı eşlemesi (case-insensitive)
# Tablodaki değerler: Dev, Test, QA, Production
# ---------------------------------------------------------------------------
mysqlinv_env_type_map:
  DEV: ["Dev"]
  TEST: ["Test"]
  QA: ["QA"]
  PROD: ["Production"]

# ListeningPort boşsa kullanılacak MySQL portu
mysqlinv_default_port: 3316

# SSH bağlantısı (ListeningIP'ye). Kullanıcı/anahtar AAP Machine credential'dan gelir.
mysqlinv_ssh_port: 22

# Survey girdileri (extra vars ile override edilir)
target_environments: []        # ['TEST','PROD'] veya "TEST,PROD"
target_servers: ""             # opsiyonel: "gbarkt02,gbarkt04"

# Test için: tanımlıysa MSSQL yerine bu JSON dosyasından satır okunur
mysqlinv_mock_file: ""
