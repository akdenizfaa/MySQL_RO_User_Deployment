---
- name: MSSQL envanter tablosunu oku (salt okunur SELECT)
  community.general.mssql_script:
    login_host: "{{ mssql_host }}"
    login_port: "{{ mssql_port | int }}"
    login_user: "{{ mssql_user }}"
    login_password: "{{ mssql_password }}"
    db: "{{ mssql_db }}"
    script: "{{ mysqlinv_query }}"
    output: dict
  register: _mysqlinv_mssql
  check_mode: false     # SELECT; check mode'da da çalışmalı
  changed_when: false

- name: MSSQL satırlarını ayıkla
  ansible.builtin.set_fact:
    mysqlinv_raw_rows: "{{ (_mysqlinv_mssql.query_results_dict | default([[[]]]))[0][0] | default([]) }}"
