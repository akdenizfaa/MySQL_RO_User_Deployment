---
- name: MSSQL bağlantı bilgilerinin geldiğini doğrula
  ansible.builtin.assert:
    that:
      - mssql_host | length > 0
      - mssql_user | length > 0
      - mssql_password | length > 0
    fail_msg: "MSSQL şifresi boş. Survey'deki 'MSSQL şifresi' alanını doldurun (mssql_password)."
    quiet: true

- name: MSSQL envanter tablosunu oku (salt okunur SELECT)
  community.general.mssql_script:
    login_host: "{{ mssql_host }}"
    login_port: "{{ mssql_port | int }}"
    login_user: "{{ mssql_user }}"
    login_password: "{{ mssql_password }}"
    db: "{{ mssql_db }}"
    script: "{{ mysqlinv_query }}"
    output: dict
  register: _mysqlinv_mssql
  check_mode: false     # SELECT; check mode'da da çalışmalı yoksa hedef listesi boş kalır
  changed_when: false   # modül her zaman changed=true döner, okuma için yanıltıcı

- name: Ham satırları ayıkla
  ansible.builtin.set_fact:
    mysqlinv_raw_rows: "{{ (_mysqlinv_mssql.query_results_dict | default([[[]]]))[0][0] | default([]) }}"
