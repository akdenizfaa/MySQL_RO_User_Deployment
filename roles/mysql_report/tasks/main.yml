---
# localhost'ta çalışır; host sonuçlarını hostvars'tan toplar.
- name: Raporu hazırla
  ansible.builtin.set_fact:
    mysqlreport: >-
      {{ groups['mysql_targets'] | default([])
         | mysqlreport_build(hostvars, mysqlinv_skipped | default([]), {
             'phase': mysqlreport_phase,
             'title': mysqlreport_title,
             'check_mode': ansible_check_mode,
             'environments': mysqlinv_summary.selected_environments | default([]),
             'inputs': mysqluser_inputs | default({}) }) }}

- name: SONUÇ RAPORU
  ansible.builtin.debug:
    msg: "{{ mysqlreport.lines }}"

# Ayrıntılar (host bazlı mesaj, ifade bazlı sonuç, native hesap listesi) artifact'ta
- name: Ayrıntıları AAP job artifact'ına yaz
  ansible.builtin.set_stats:
    data:
      mysqlreport_summary: "{{ mysqlreport.summary }}"
      mysqlreport_hosts: "{{ mysqlreport.hosts }}"
      mysqlreport_apply: "{{ mysqlreport.apply }}"
      mysqlreport_native: "{{ mysqlreport.native }}"
    per_host: false

- name: Job durumu
  ansible.builtin.fail:
    msg: >-
      {{ mysqlreport.summary.failed_servers | length }}/{{ groups['mysql_targets'] | default([]) | length }}
      sunucuda hata veya yapılamayan işlem var: {{ mysqlreport.summary.failed_servers | join(', ') }}.
      {{ 'Diğer sunucular işlendi. ' if (mysqlreport.summary.failed_servers | length) < (groups['mysql_targets'] | default([]) | length) else '' }}Ayrıntı: SONUÇ RAPORU.
  when:
    - mysqlreport_fail_on_error | bool
    - mysqlreport.summary.failed_servers | length > 0
