---
# localhost'ta bir kez çalışır (survey girdisi doğrulama). Girdiler raporun başlığında görünür.
# Şifrenin kendisi değil yalnızca dolu olup olmadığı gönderilir; hata mesajı görünür kalır.
- name: Survey girdilerini doğrula
  ansible.builtin.set_fact:
    mysqluser_inputs: >-
      {{ target_user | mysqluser_validate(target_user_password | default('') | length > 0,
                                          target_user_hosts, privilege_sets, password_mismatch_action) }}
