# AAP > Administration (Automation Execution > Infrastructure) > Credential Types > Add
# Name: MSSQL Inventory
# Aşağıdaki iki bloğu ilgili alanlara yapıştırın.

# ---- INPUT CONFIGURATION ----
fields:
  - id: host
    type: string
    label: MSSQL Host
    help_text: "Örn: PGARSQLTEM01"
  - id: port
    type: string
    label: MSSQL Port
    default: "1433"
  - id: username
    type: string
    label: Username (salt okunur hesap önerilir)
  - id: password
    type: string
    label: Password
    secret: true
required:
  - host
  - username
  - password

# ---- INJECTOR CONFIGURATION ----
# extra_vars yerine env kullanılır: secret job extra-vars görünümüne düşmez.
env:
  MSSQL_INV_HOST: "{{ host }}"
  MSSQL_INV_PORT: "{{ port }}"
  MSSQL_INV_USER: "{{ username }}"
  MSSQL_INV_PASSWORD: "{{ password }}"
