---
# FAZ 3 - Kullanıcı kontrolü ve audit. Hedeflerde DEĞİŞİKLİK YAPMAZ.
# Hedef kullanıcının şifresi sunuculara gönderilmez (hash AAP içinde karşılaştırılır).
# Credential: SSH:uxsqlteam | Survey: aap/surveys/user_check_survey.json

- name: Girdiler ve envanter
  hosts: localhost
  gather_facts: false
  pre_tasks:
    - name: MySQL admin şifresi girilmiş olmalı
      ansible.builtin.assert:
        that: mysql_admin_password | default('') | length > 0
        fail_msg: "Survey'deki 'MySQL admin şifresi' alanı boş."
        quiet: true
    - name: Survey girdileri
      ansible.builtin.include_role:
        name: mysql_user_check
        tasks_from: validate.yml
  roles:
    - mysql_inventory

- name: Sunucular
  hosts: mysql_targets
  gather_facts: false
  become: false
  roles:
    - role: mysql_host
      vars: {mysql_host_mode: check}

- name: Rapor
  hosts: localhost
  gather_facts: false
  roles:
    - role: mysql_report
      vars:
        mysqlreport_phase: check
        mysqlreport_title: "MySQL kullanıcı kontrol raporu"
