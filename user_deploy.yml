---
# FAZ 4 - Kullanıcı oluştur / yetki ver / (seçime göre) şifre güncelle.
# ÖNCE Job Type: Check (hiçbir SQL çalışmaz), sonra Run.
# Credential: SSH:uxsqlteam | Survey: aap/surveys/user_deploy_survey.json
#
# Log: hedef başına 1 satır (ok = değişiklik yok, changed = değişiklik yapıldı);
# sonunda SONUÇ RAPORU: her sunucuda ne yapıldı / neden yapılamadı.
# Bir sunucuda bağlantı veya SQL hatası diğerlerini durdurmaz.
#
# Kurallar: yeni/güncellenen hesaplar caching_sha2_password; REVOKE yok;
# read_only (replika/secondary), port uyuşmazlığı ve şifre politikası ihlalinde yazılmaz.

- name: Girdiler ve envanter
  hosts: localhost
  gather_facts: false
  pre_tasks:
    - name: MySQL admin şifresi girilmiş olmalı
      ansible.builtin.assert:
        that: mysql_admin_password | default('') | length > 0
        fail_msg: "Survey'deki 'MySQL admin şifresi' alanı boş."
        quiet: true
    - name: Survey girdileri
      ansible.builtin.include_role:
        name: mysql_user_check
        tasks_from: validate.yml
  roles:
    - mysql_inventory

- name: Sunucular
  hosts: mysql_targets
  gather_facts: false
  become: false
  roles:
    - role: mysql_host
      vars: {mysql_host_mode: deploy}

- name: Rapor
  hosts: localhost
  gather_facts: false
  roles:
    - role: mysql_report
      vars:
        mysqlreport_phase: deploy
        mysqlreport_title: "MySQL kullanıcı dağıtım raporu"
