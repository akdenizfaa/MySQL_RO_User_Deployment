---
# FAZ 2 - Bağlantı testi. Hedeflerde DEĞİŞİKLİK YAPMAZ.
# Credential: SSH:uxsqlteam | Survey: aap/surveys/connectivity_check_survey.json
#
# Log: hedef başına 1 satır; sonunda SONUÇ RAPORU. Bir sunucuya bağlanılamaması
# diğerlerini durdurmaz.

- name: Envanter
  hosts: localhost
  gather_facts: false
  pre_tasks:
    - name: MySQL admin şifresi girilmiş olmalı
      ansible.builtin.assert:
        that: mysql_admin_password | default('') | length > 0
        fail_msg: "Survey'deki 'MySQL admin şifresi' alanı boş."
        quiet: true
  roles:
    - mysql_inventory

- name: Sunucular
  hosts: mysql_targets
  gather_facts: false
  become: false
  roles:
    - role: mysql_host
      vars: {mysql_host_mode: connect}

- name: Rapor
  hosts: localhost
  gather_facts: false
  roles:
    - role: mysql_report
      vars:
        mysqlreport_phase: connect
        mysqlreport_title: "MySQL bağlantı raporu"
