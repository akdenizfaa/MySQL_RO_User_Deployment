---
# ansible-builder v3 tanımı (AAP 2.4 / Controller 4.5.x).
# Build (podman olan, registry.redhat.io'ya login olmuş bir makinede):
#   pip install ansible-builder
#   cd execution-environment
#   ansible-builder build -f execution-environment.yml -t <registry>/ee-mysql-user-mgmt:1.0
#   podman push <registry>/ee-mysql-user-mgmt:1.0
#
# Neden gerekli: MSSQL'i okumak için EE içinde 'pymssql' Python kütüphanesi ve
# community.general koleksiyonu olmalı. AAP'nin varsayılan EE'lerinde pymssql yok.
version: 3

images:
  base_image:
    name: registry.redhat.io/ansible-automation-platform-24/ee-minimal-rhel8:latest

options:
  package_manager_path: /usr/bin/microdnf

dependencies:
  galaxy:
    collections:
      - name: community.general   # mssql_script; 12+ ansible-core >=2.17 ister
        version: ">=8.0.0,<12.0.0"
  python: requirements.txt

additional_build_steps:
  append_final:
    - RUN python3 -c "import pymssql; print('pymssql ok')"
